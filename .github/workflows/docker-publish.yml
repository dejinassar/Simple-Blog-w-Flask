
name: Build, Publish and Deploy Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/dejinassar/simple-blog-w-flask

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to EC2
        run: |
          set -eu

          echo "Pulling latest image"
          docker pull "${IMAGE_NAME}:latest"

          echo "Preserving current application secret"
          SECRET_KEY="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' flask-blog-container | sed -n 's/^SECRET_KEY=//p')"
          test -n "$SECRET_KEY"

          echo "Stopping old container"
          docker stop flask-blog-container
          docker rm flask-blog-container

          echo "Starting updated container"
          docker run -d \
            --name flask-blog-container \
            --restart unless-stopped \
            -p 80:5000 \
            -e DATABASE_URI=sqlite:////data/site.db \
            -e SECRET_KEY="$SECRET_KEY" \
            -v flask-blog-data:/data \
            "${IMAGE_NAME}:latest"

          echo "Checking application response"
          sleep 5
          curl --fail --silent --show-error http://localhost/ > /dev/null
