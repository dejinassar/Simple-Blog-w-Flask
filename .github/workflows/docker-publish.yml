
name: Build, Publish and Deploy Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/dejinassar/simple-blog-w-flask

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/flask-blog-deploy
          chmod 600 ~/.ssh/flask-blog-deploy

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/flask-blog-deploy \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -eu

          IMAGE="ghcr.io/dejinassar/simple-blog-w-flask:latest"

          echo "Checking the existing container configuration..."
          SECRET_KEY="$(sudo docker inspect \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            flask-blog-container |
            grep '^SECRET_KEY=' | cut -d= -f2-)"

          if [ -z "$SECRET_KEY" ]; then
            echo "ERROR: Could not retrieve the existing SECRET_KEY."
            exit 1
          fi

          echo "Pulling the latest image..."
          sudo docker pull "$IMAGE"

          echo "Replacing the application container..."
          sudo docker rm -f flask-blog-container

          sudo docker run -d \
            --name flask-blog-container \
            --restart unless-stopped \
            -p 80:5000 \
            -e DATABASE_URI=sqlite:////data/site.db \
            -e SECRET_KEY="$SECRET_KEY" \
            -v flask-blog-data:/data \
            "$IMAGE"

          echo "Checking application container status..."
          sudo docker ps --filter name=flask-blog-container

          echo "Deployment commands completed."
          REMOTE

