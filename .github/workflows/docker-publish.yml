
name: Build, Publish and Deploy Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/dejinassar/simple-blog-w-flask

jobs:
  build-and-deploy:
  runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Diagnose EC2 SSH connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -eu

          echo "Step 1: Checking deployment settings"
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_PRIVATE_KEY"

          echo "Step 2: Preparing SSH key"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/flask-blog-deploy
          chmod 600 ~/.ssh/flask-blog-deploy

          echo "Step 3: Checking SSH key format"
          ssh-keygen -y -f ~/.ssh/flask-blog-deploy > /dev/null

          echo "Step 4: Testing SSH network connectivity"
          if timeout 10 bash -c 'cat < /dev/null > /dev/tcp/'"$EC2_HOST"'/22' 2>/dev/null; then
            echo "Port 22 is reachable"
          else
            echo "Port 22 is not reachable from this GitHub runner"
            exit 1
          fi

          echo "Step 5: Scanning EC2 host key"
          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts

          echo "Step 6: Connecting to EC2"
          ssh -vvv \
            -o ConnectTimeout=15 \
            -o BatchMode=yes \
            -i ~/.ssh/flask-blog-deploy \
            "$EC2_USER@$EC2_HOST" \
            'echo "SSH connection successful"; sudo docker ps --filter name=flask-blog-container'

